<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Come ti senti oggi?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Sfondo con gradiente animato */
            background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Effetto Vetro (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        /* Stile delle singole carte/pulsanti */
        .emoji-card {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .emoji-card:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.9);
        }

        @media (hover: hover) {
            .emoji-card:hover {
                transform: translateY(-8px);
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .bounce-heart {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
<body onload="initApp()">

    <!-- Schermata Principale -->
    <div id="main-screen" class="glass-panel rounded-[2rem] p-6 md:p-12 w-[92%] max-w-6xl text-center z-10 relative min-h-[400px] flex flex-col justify-center">
        <!-- Skeleton Loader mostrato durante il caricamento dal foglio -->
        <div class="animate-pulse flex flex-col items-center justify-center py-8">
            <div class="h-10 md:h-14 bg-white/50 rounded-xl w-3/4 mb-12"></div>
            <div class="flex flex-wrap justify-center gap-4 md:gap-6 w-full">
                <div class="h-40 w-[42%] md:w-48 bg-white/50 rounded-3xl"></div>
                <div class="h-40 w-[42%] md:w-48 bg-white/50 rounded-3xl"></div>
                <div class="h-40 w-[42%] md:w-48 bg-white/50 rounded-3xl hidden md:block"></div>
            </div>
            <p class="text-gray-500 mt-8 font-semibold tracking-wide">Sincronizzazione in corso...</p>
        </div>
    </div>

    <!-- Schermata di Ringraziamento -->
    <div id="thank-you-screen" class="hidden absolute inset-0 bg-black/20 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="glass-panel rounded-[3rem] p-12 md:p-20 text-center mx-4 shadow-2xl">
            <div class="text-8xl md:text-[140px] mb-6 bounce-heart drop-shadow-xl">💖</div>
            <h2 class="text-4xl md:text-6xl font-extrabold text-gray-800 drop-shadow-sm">
                Grazie!
            </h2>
            <p class="text-xl md:text-3xl text-gray-700 mt-4 font-semibold">
                Risposta registrata.
            </p>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ INSERISCI QUI L'URL DEL TUO WEB APP GAS
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx95lDQOcBrIn_gC80Lmrna9u-XWEiXZ-fwDY09us-_fggKYKVzJKqHSExegdPIq5W3Pg/exec';
        
        let isSubmitting = false;
        let currentQuestion = ""; // Variabile per memorizzare la domanda attuale

        // Configurazione di default (usata se GAS non è ancora configurato o se salta la connessione)
        const defaultConfig = {
            question: "Come ti senti oggi?",
            options: [
                { emoji: "😢", label: "Triste", value: "Triste" },
                { emoji: "😕", label: "Confuso", value: "Confuso" },
                { emoji: "😐", label: "Normale", value: "Normale" },
                { emoji: "🙂", label: "Bene", value: "Bene" },
                { emoji: "🤩", label: "Super!", value: "Super" }
            ]
        };

        // Inizializza l'app chiedendo la configurazione attuale a Google Sheets
        async function initApp() {
            let config = defaultConfig;
            
            if (SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbx95lDQOcBrIn_gC80Lmrna9u-XWEiXZ-fwDY09us-_fggKYKVzJKqHSExegdPIq5W3Pg/exec') {
                try {
                    // Effettua una chiamata GET per leggere la configurazione dal foglio
                    const response = await fetch(SCRIPT_URL);
                    config = await response.json();
                } catch (error) {
                    console.error('Errore nel caricamento della configurazione dal foglio, uso fallback:', error);
                }
            }
            
            currentQuestion = config.question; // Salviamo la domanda per inviarla dopo
            renderApp(config);
        }

        // Genera dinamicamente le carte nell'interfaccia in base alla configurazione ricevuta
        function renderApp(config) {
            const mainScreen = document.getElementById('main-screen');
            
            // Usiamo flex-wrap così se imposti 3, 4 o 6 risposte, si adatteranno da sole al centro
            let html = `
                <h1 class="text-4xl md:text-6xl font-extrabold text-gray-800 mb-8 md:mb-12 drop-shadow-sm tracking-tight leading-tight">
                    ${config.question}
                </h1>
                <div class="flex flex-wrap justify-center gap-4 md:gap-6">`;
            
            config.options.forEach(opt => {
                html += `
                    <button onclick="sendMood('${opt.value}', this)" class="emoji-card rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center focus:outline-none w-[42%] md:w-auto md:min-w-[160px]">
                        <div class="text-6xl md:text-8xl mb-4 filter drop-shadow-sm">${opt.emoji}</div>
                        <span class="text-xl md:text-2xl font-bold text-gray-700">${opt.label}</span>
                    </button>
                `;
            });
            
            html += `</div>`;
            mainScreen.innerHTML = html;
        }

        async function sendMood(moodValue, buttonElement) {
            if (isSubmitting) return;
            isSubmitting = true;

            const thankYouScreen = document.getElementById('thank-you-screen');
            thankYouScreen.classList.remove('hidden');
            thankYouScreen.classList.add('fade-in');

            try {
                if (SCRIPT_URL === 'INCOLLA_QUI_IL_TUO_URL_DI_GOOGLE_APPS_SCRIPT') {
                    console.log('Simulazione invio dati:', { risposta: moodValue, domanda: currentQuestion, timestamp: new Date().toISOString() });
                } else {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8', 
                        },
                        // Ora inviamo sia il mood (risposta) sia la domanda corrente
                        body: JSON.stringify({ mood: moodValue, question: currentQuestion })
                    });
                }
            } catch (error) {
                console.error('Errore durante l\'invio:', error);
            } finally {
                setTimeout(() => {
                    thankYouScreen.classList.add('hidden');
                    thankYouScreen.classList.remove('fade-in');
                    isSubmitting = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
